# CLAUDE.md §8.2: E06 = cnn_best 對照（深層對照，66.6M 參數，VGG風格）。
# src/models/cnn_best.py 已實作（逐行對照 ASCAD/ASCAD_train_models.py::cnn_best
# 這個上游參考碼，參數量精確對上 66,652,544），這份 config 可以完整跑。
# 注意 configs/model/cnn_best.yaml 用 RMSprop lr=1e-5（陷阱清單 #10，改
# Adam 1e-3 會發散）；還沒針對這個模型另外調過 one-cycle 之類的訓練方法論。
exp_id: E06_cnn_best
description: cnn_best（ASCAD 原論文 VGG 風格，66.6M參數）對照組，desync0

seed: 42

data: ascad_desync0
model: cnn_best

preprocess:
  minmax: true

leakage:
  model: ID
  n_classes: 256

augment:
  gaussian:
    enabled: false
    sigma_ratio: 0.5

attack:
  eval_set: E
  max_traces: 1000
  n_runs: 100
  seed: 1234
