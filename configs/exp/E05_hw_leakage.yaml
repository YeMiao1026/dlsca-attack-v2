# CLAUDE.md §8.2: E05 = HW 洩漏模型（對照組，9類，類別不平衡需注意，見陷阱
# 清單 #9——必要時加 class weight）。其餘設定與 E01 相同。
#
# scores.build 現在支援 HW（見附錄 B.19：leakage_model="HW" 時會先把
# Sbox 假設值映射到 Hamming weight 再索引 9 類機率），這份 config 可以完整跑。
exp_id: E05_hw_leakage
description: HW（Hamming Weight）洩漏模型對照組，desync0

seed: 42

data: ascad_desync0
model: cnn_light

preprocess:
  minmax: true

leakage:
  model: HW
  n_classes: 9

augment:
  gaussian:
    enabled: false
    sigma_ratio: 0.5

attack:
  eval_set: E
  max_traces: 1000
  n_runs: 100
  seed: 1234
