# CLAUDE.md §8.2 extension: E09 = ASCADv1 variable-key baseline.
#
# Purpose: the whole project's conclusions (E01's recipe, and everything the
# defense-side sub-project built on top of it) rest on ONE database — ASCAD
# fixed-key desync0. This is the first test of whether they survive a change of
# database. Variable-key is the standard next step in the SCA literature because
# it removes the single most generous assumption in the fixed-key setting: with
# one profiling key, a model can partly memorise that key's S-box row; with 256
# profiling keys it must learn a key-independent leakage function.
#
# Design: identical in every controllable respect to E01_baseline_clean — same
# cnn_light recipe (he_uniform + one-cycle + MinMax, 附錄 B.16), same A/V/D
# sizes, same seed, same leakage model, same evaluation protocol — so the only
# deliberate variable is the database. The one unavoidable difference is
# data.trace_len (1400 vs 700), which is a property of the extraction window,
# not a tuning choice.
#
# Expectation is explicitly NOT "this will work": E01's hyperparameters were
# tuned over ~15 runs against fixed-key desync0 specifically, and this project
# has repeatedly found that such recipes do not transfer (desync50/100 in 附錄
# B.18/B.25-B.28, resnet in 附錄 B.56-B.60). A negative result here is a real
# result about generalisability, not a failure to be tuned away.
exp_id: E09_ascad_variable
description: ASCADv1 variable-key 基準（E01 配方原封不動移植，唯一變因是資料庫）

seed: 42

data: ascad_variable
model: cnn_light

preprocess:
  minmax: true

leakage:
  model: ID
  n_classes: 256
  # masks[2] = byte 2's own mask on this database (NOT 0 as on the fixed-key
  # file). Pinned rather than auto-detected so the label definition is fixed by
  # config and cannot silently drift between runs; verified by scanning all 18
  # columns — see configs/data/ascad_variable.yaml and CLAUDE.md 附錄 B.61.
  mask_index: 2

augment:
  gaussian:
    enabled: false
    sigma_ratio: 0.5

attack:
  eval_set: E
  # 9000 to line up with every other headline number in this project. Note the
  # attack set here holds 100,000 traces (vs 10,000), so each of the 100 runs
  # draws its 9000 from a much larger pool — sampling is strictly more
  # independent than on the fixed-key database, not less.
  max_traces: 9000
  n_runs: 100
  seed: 1234
