# CLAUDE.md §8.2: E07 = resnet 對照（Stage B transferability，測試架構
# 錯配時的可遷移性，約30K參數）。
# src/models/resnet.py 已實作（3個殘差區塊+GAP，28,816參數，ReLU+BN+he_normal，
# 沒有上游參考碼可抄，自行設計逼近§6.1的~30K目標），這份 config 可以完整跑。
# 訓練配方已在 configs/model/resnet.yaml 針對這個架構調過四個維度
# （附錄 B.45-B.49），不再沿用 cnn_light 的 one-cycle 參數——resnet 的最佳
# peak LR（5e-5）比 cnn_light（5e-3）低了兩個數量級。
exp_id: E07_resnet
description: resnet（3個殘差區塊+GAP）對照組，desync0

seed: 42

data: ascad_desync0
model: resnet

preprocess:
  minmax: true

leakage:
  model: ID
  n_classes: 256

augment:
  gaussian:
    enabled: false
    sigma_ratio: 0.5

attack:
  eval_set: E
  # 9000, not 1000: every E07 evaluation actually reported (附錄 B.45-B.49 and
  # the defense-side 附錄 O/R/S seed sweeps) used a 9000-trace window, because
  # resnet's GE is still descending well past 1000 — a 1000-trace window here
  # would silently disagree with every number those sections quote.
  max_traces: 9000
  n_runs: 100
  seed: 1234
