# CLAUDE.md §8.2: E07 = resnet 對照（Stage B transferability，測試架構
# 錯配時的可遷移性，約30K參數）。
# src/models/resnet.py 已實作（3個殘差區塊+GAP，28,816參數，ReLU+BN+he_normal，
# 沒有上游參考碼可抄，自行設計逼近§6.1的~30K目標），這份 config 可以完整跑。
# 沿用 E01 的 one-cycle 訓練配方（configs/model/resnet.yaml 目前用固定
# Adam lr=1e-3，還沒針對這個架構調過 one-cycle 之類的訓練方法論）。
exp_id: E07_resnet
description: resnet（3個殘差區塊+GAP）對照組，desync0

seed: 42

data: ascad_desync0
model: resnet

preprocess:
  minmax: true

leakage:
  model: ID
  n_classes: 256

augment:
  gaussian:
    enabled: false
    sigma_ratio: 0.5

attack:
  eval_set: E
  max_traces: 1000
  n_runs: 100
  seed: 1234
