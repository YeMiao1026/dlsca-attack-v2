# ASCAD fixed-key, **byte 3**, DUAL-window extraction (1400 points).
# Built by scripts/07_extract_window.py --windows 79352:80052 98513:99213.
# ⚠ See CLAUDE.md 附錄 B.74: 附錄 B.66's stated reason for this dual window
# ("no single window can hold both shares") was WRONG and has been retracted.
#
# The short version: an ID (mask-unknown) attack must combine two leakages —
# the masked value Z^r and the mask r itself, so a window holding only one of
# them cannot work whatever the model does. THIS window pair was built on the
# belief that byte 3's two shares are 19,161 raw points apart and therefore
# cannot share a 700-point window. That belief was wrong: Egger et al. (COSADE
# 2022, App. A.1) publish a per-byte window for every byte, and inside their
# byte-3 window [32906,33606) both shares are present (Z^r 8.56, r 1.25 —
# measured, 附錄 B.74). Our [79352,80052) sits past the END of the whole masked
# SubBytes region (all 16 windows end by raw 50265), where only the residual
# masked value survives and the mask does not leak at all (0.0392, noise).
#
# The file is kept because the measurement it produces is still the best one:
# Egger's single window reaches only GE@9000 = 1.85-11.71 over three seeds
# (E10d), whereas this dual window reaches N_TGE = 8 — the dual window pairs a
# much stronger residual Z^r (16.23) with a strong mask leak, not because a
# single window is impossible.
#
# This file therefore concatenates a 700-point window around each POI. Verified
# on A: masked value peak 15.4535 @ point 350, mask peak 17.4826 @ point 1050,
# unmasked control 0.0110. Both leakages are in fact STRONGER than byte 2's
# (6.3003 and 1.2737), so on signal quality alone byte 3 should be the easier
# target.
#
# Caveat to state when comparing against E01: trace_len is 1400, not 700, so
# cnn_light has 32,640 parameters here versus 18,640 on byte 2 (the flatten->FC
# layer scales with input length). "Same recipe" is not literally the same model.
data:
  path: data/ASCAD_byte3_dual.h5
  target_byte: 3
  trace_len: 1400

split:
  n_attacker: 30000
  n_val: 5000
  n_defender: 15000
  seed: 42
